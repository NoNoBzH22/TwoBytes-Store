name: dvinyl
services:
  dvinyl:
    image: ghcr.io/kyonew/dvinyl:4.0.0@sha256:9ad7a3b949e9957f34a8fc7c78f26e4c8eecd40fcd5e914511efd55408f3405d
    container_name: dvinyl
    restart: unless-stopped
    depends_on:
      - dvinyl-db
    ports:
      - target: 3099
        published: "3099"
        protocol: tcp
    environment:
      MONGODB_URL: mongodb://dvinyl-db:27017/dvinyl
      VINYL_PORT: "3099"
      PROD: "false"
      BASE_URL: ""
      DISCOGS_TOKEN: ""
      HARDCOVER_API_KEY: ""
      TMDB_API_KEY: ""
      TWITCH_CLIENT_ID: ""
      TWITCH_CLIENT_SECRET: ""
      REBRICKABLE_API_KEY: ""
    # PASSJWT et SESSION_SECRET sont obligatoires : on les génère au premier démarrage
    # dans /secrets (hors du dossier uploads, qui est servi publiquement), puis on les relit.
    command:
      - sh
      - -c
      - |
        umask 077
        [ -s /secrets/secrets.env ] || node -e "const c=require('crypto');for(const k of ['PASSJWT','SESSION_SECRET'])console.log(k+'='+c.randomBytes(32).toString('hex'))" > /secrets/secrets.env
        set -a
        . /secrets/secrets.env
        set +a
        exec node --import tsx app.ts
    # Depuis 4.0, toute la collection tient dans /app/data/dvinyl.sqlite. MongoDB n'est gardé
    # que pour les installations 3.x : au premier démarrage avec /app/data monté, DVinyl y
    # copie seul les données de MongoDB (qui n'est que lu). Sur une installation neuve, la
    # base Mongo est vide et rien n'est importé.
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
      - type: bind
        source: /DATA/AppData/$AppID/uploads
        target: /app/public/uploads
      - type: bind
        source: /DATA/AppData/$AppID/secrets
        target: /secrets
  dvinyl-db:
    image: mongo:8.0@sha256:9b73c38e39783bd21335f603a9f08be60fe385f5c28933ea32bb4a9fa1fd6d23
    container_name: dvinyl-db
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mongo
        target: /data/db
x-casaos:
  id: me.kyonew.dvinyl
  main: dvinyl
  icon: https://raw.githubusercontent.com/NoNoBzH22/TwoBytes-Store/gh-pages/apps/me.kyonew.dvinyl/assets/icon.png
  title:
    en_US: DVinyl
  index: /
  port_map: "3099"
  scheme: http
  version: "4.0.0"
